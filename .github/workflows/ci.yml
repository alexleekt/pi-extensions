name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

jobs:
    shared:
        name: Shared typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22.22.3"
                  cache: "npm"

            - name: Setup just
              uses: extractions/setup-just@v4
              with:
                  just-version: "1.52.0"

            - name: Install dependencies
              run: npm ci

            - name: Check shared package
              run: just ci-shared

    check:
        needs: shared
        if: ${{ always() }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                package:
                    - pi-bump
                    - pi-pkg-guard
                    - pi-ask-user-glimpse
                    - pi-heading
                    - pi-worktrunk-signal
                    - pi-patch-manager
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22.22.3"
                  cache: "npm"

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.14"

            - name: Setup just
              uses: extractions/setup-just@v4
              with:
                  just-version: "1.52.0"

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium
              if: matrix.package == 'pi-ask-user-glimpse'
              working-directory: packages/pi-ask-user-glimpse
              run: npx playwright install --with-deps chromium

            - name: Run package CI
              run: just ci-package ${{ matrix.package }}
